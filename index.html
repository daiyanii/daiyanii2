<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ilm — A Path Through Islamic Knowledge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

/* ============ TOKENS ============ */
:root{
  --parchment:#F3ECDA;
  --parchment-2:#EAE1C9;
  --ink:#1B2420;
  --ink-soft:#3C463F;
  --gold:#9C7328;
  --gold-2:#B8863B;
  --teal:#215B51;
  --line: rgba(27,36,32,0.16);
  --card-bg: rgba(255,255,255,0.35);
  --shadow: 0 1px 0 rgba(27,36,32,0.06);
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --parchment:#0B1512;
    --parchment-2:#0F1B17;
    --ink:#ECE4CE;
    --ink-soft:#B9AE93;
    --gold:#D4AF6A;
    --gold-2:#C79A50;
    --teal:#5FA99B;
    --line: rgba(236,228,206,0.14);
    --card-bg: rgba(255,255,255,0.035);
    --shadow: 0 1px 0 rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"]{
  --parchment:#0B1512;
  --parchment-2:#0F1B17;
  --ink:#ECE4CE;
  --ink-soft:#B9AE93;
  --gold:#D4AF6A;
  --gold-2:#C79A50;
  --teal:#5FA99B;
  --line: rgba(236,228,206,0.14);
  --card-bg: rgba(255,255,255,0.035);
  --shadow: 0 1px 0 rgba(0,0,0,0.4);
}

*{box-sizing:border-box;}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
html,body{height:100%;}
body{
  margin:0;
  background:var(--parchment);
  color:var(--ink);
  font-family:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition: background .4s ease, color .4s ease;
}
h1,h2,h3,.display{
  font-family:'Amiri',Georgia,'Times New Roman',serif;
  font-weight:700;
  margin:0;
  letter-spacing:.2px;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
::selection{background:var(--gold); color:var(--parchment);}

/* subtle background weave, geometric, not figurative */
.weave{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(135deg, var(--line) 1px, transparent 1px),
    linear-gradient(45deg, var(--line) 1px, transparent 1px);
  background-size: 42px 42px;
  opacity:.35;
}

#app{position:relative; z-index:1; min-height:100vh; height:100%;}

.view{
  min-height:100vh;
  width:100%;
  opacity:0;
  animation: viewIn .5s ease forwards;
}
@keyframes viewIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
@media (prefers-reduced-motion: reduce){
  .view{animation:none; opacity:1;}
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* ============ INTRO ============ */
.intro{
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center;
  padding: 8vh 1.5rem;
  cursor:pointer;
  gap: 1.6rem;
}
.intro-star{ width:min(46vw,220px); height:min(46vw,220px); }
.intro-star path{
  fill:none; stroke:var(--gold); stroke-width:1.4;
  stroke-dasharray: 900; stroke-dashoffset:900;
  animation: draw 2.4s ease forwards;
}
.intro-star .inner-mark{
  fill: var(--gold); opacity:0;
  animation: fadeMark .8s ease forwards .8s;
}
@keyframes draw{ to{stroke-dashoffset:0;} }
@keyframes fadeMark{ to{opacity:1;} }

.intro h1{
  font-size: clamp(2.1rem, 6vw, 3.6rem);
  opacity:0;
  animation: riseIn .9s ease forwards 1.6s;
  color:var(--ink);
}
.intro .kicker{
  font-size:.95rem;
  color:var(--ink-soft);
  letter-spacing:.4px;
  opacity:0;
  animation: riseIn .9s ease forwards 2s;
  max-width:38ch;
  line-height:1.5;
}
@keyframes riseIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

.enter-hint{
  opacity:0;
  animation: riseIn .9s ease forwards 2.5s, pulse 2.4s ease-in-out infinite 3.4s;
  font-size:.85rem;
  color:var(--gold-2);
  display:flex; align-items:center; gap:.5rem;
}
@keyframes pulse{ 0%,100%{opacity:.65;} 50%{opacity:1;} }
.enter-hint svg{width:14px; height:14px;}

/* ============ HEADER / NAV ============ */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding: 1.4rem clamp(1.25rem,4vw,3rem);
  border-bottom:1px solid var(--line);
}
.wordmark{
  display:flex; align-items:center; gap:.55rem;
  font-family:'Amiri',serif; font-weight:700; font-size:1.15rem;
}
.wordmark svg{width:22px; height:22px;}
.wordmark svg path{stroke:var(--gold); fill:none; stroke-width:1.6;}
.crumbs{
  font-size:.82rem; color:var(--ink-soft);
  display:flex; gap:.4rem; align-items:center; flex-wrap:wrap;
}
.crumbs a:hover{color:var(--gold-2);}
.crumbs .sep{opacity:.5;}

main{ max-width:1080px; margin:0 auto; padding: clamp(2rem,5vw,4rem) clamp(1.25rem,4vw,3rem) 6rem; }

/* ============ INDEX ============ */
.index-head{ max-width:62ch; margin-bottom: clamp(2rem,5vw,3.2rem); }
.index-head h1{ font-size:clamp(2rem,4.2vw,2.9rem); margin-bottom:.7rem; }
.index-head p{ color:var(--ink-soft); line-height:1.65; font-size:1.02rem; }

.forum-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:1.1rem;
}
.forum-card{
  position:relative;
  background:var(--card-bg);
  border:1px solid var(--line);
  border-radius: 4px 4px 26px 4px;
  padding:1.7rem 1.5rem 1.6rem;
  display:flex; flex-direction:column; gap:.9rem;
  transition: border-color .25s ease, transform .25s ease;
}
.forum-card:hover, .forum-card:focus-visible{
  border-color:var(--gold-2);
  transform: translateY(-2px);
}
.forum-card .ic{width:30px; height:30px;}
.forum-card .ic path, .forum-card .ic circle, .forum-card .ic line{
  stroke:var(--teal); fill:none; stroke-width:1.5;
}
.forum-card h2{ font-size:1.35rem; }
.forum-card p{ color:var(--ink-soft); font-size:.92rem; line-height:1.55; margin:0; }
.forum-card .count{
  margin-top:auto; font-size:.78rem; color:var(--gold-2);
  display:flex; align-items:center; gap:.4rem;
  padding-top:.6rem; border-top:1px solid var(--line);
}

/* ============ FORUM PAGE ============ */
.forum-head{ display:flex; align-items:center; gap:.9rem; margin-bottom:.6rem; }
.forum-head .ic{width:34px; height:34px; flex-shrink:0;}
.forum-head .ic path,.forum-head .ic circle,.forum-head .ic line{ stroke:var(--gold-2); fill:none; stroke-width:1.5; }
.forum-head h1{ font-size:clamp(1.9rem,4vw,2.6rem); }
.forum-sub{ color:var(--ink-soft); max-width:60ch; line-height:1.6; margin: .3rem 0 2.4rem; }

.toc{ border-top:1px solid var(--line); }
.toc-item{
  display:flex; align-items:baseline; gap:1rem;
  padding: 1.05rem 0.2rem;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}
.toc-item .num{
  font-family:'Amiri',serif; color:var(--gold-2); font-size:.95rem;
  min-width:2ch; flex-shrink:0;
}
.toc-item .body{ flex:1; min-width:0; }
.toc-item .ttl{ font-size:1.06rem; }
.toc-item .desc{ color:var(--ink-soft); font-size:.88rem; margin-top:.2rem; line-height:1.5; }
.toc-item .arrow{ color:var(--ink-soft); flex-shrink:0; transition: transform .2s ease, color .2s ease; }
.toc-item:hover .ttl{ color:var(--gold-2); }
.toc-item:hover .arrow{ transform:translateX(4px); color:var(--gold-2); }

/* ============ SUBFORUM PAGE ============ */
.sf-eyebrow{ color:var(--ink-soft); font-size:.85rem; margin-bottom:.6rem; }
.sf-title{ font-size:clamp(1.9rem,4vw,2.7rem); margin-bottom:1.1rem; max-width:24ch; }
.sf-desc{ color:var(--ink-soft); max-width:62ch; line-height:1.7; font-size:1.04rem; margin-bottom:2.4rem; }
.sf-panel{
  border:1px dashed var(--line);
  border-radius:4px;
  padding: 2.1rem 1.8rem;
  max-width:62ch;
  display:flex; gap:1rem; align-items:flex-start;
}
.sf-panel svg{width:22px; height:22px; flex-shrink:0; margin-top:.1rem;}
.sf-panel svg path{ stroke:var(--gold-2); fill:none; stroke-width:1.5; }
.sf-panel p{ margin:0; line-height:1.6; color:var(--ink-soft); font-size:.96rem; }
.sf-panel strong{ color:var(--ink); font-weight:600; }

.back-link{
  display:inline-flex; align-items:center; gap:.4rem;
  margin-top:2.4rem; font-size:.9rem; color:var(--gold-2);
}
.back-link:hover{ text-decoration:underline; }

footer{
  border-top:1px solid var(--line);
  padding: 2rem clamp(1.25rem,4vw,3rem) calc(2rem + env(safe-area-inset-bottom,0px));
  text-align:center; color:var(--ink-soft); font-size:.8rem;
}

@media (max-width:640px){
  .toc-item .desc{ display:none; }
}
</style>
</head>
<body>
<div class="weave"></div>
<div id="app"></div>

<script>
/* ============ DATA ============ */
const FORUMS = [

      ["Introduction to the religion",""],

    icon:"lantern",

    subs:[
      ["Aqeedah","The core articles of Islamic creed and belief.",[
        ["Introduction to Aqeedah",""],

        ["Salafi Manhaj",""],
        ["Nawaqidul-Islam",""],
        ["Bidah",""],
        ["Iman and its Pillars",""],
        ["Pillars of Islam",""],
        ["Pillar of Ihsan",""],
        ["Takfir",""],
        ["Udhr bil Jahil",""],
        ["Warning Against Heretics",""],
        ["Al Wala wal Bara",""],
        ["Kufr bi Taghut wa Iman Billah",""],
        ["Meaning of Life",""],
        ["The Akhirah",""]
      ]],
      ["Ethics and Morality","",[
        ["Defining good and evil",""],
        ["Halal and its subsets",""],
        ["Haram and its subsets",""]
      ]],

      ["Importance of learning Arabic","Why Arabic is central to understanding scripture and worship."]
    ]
  },
  {
    id:"refutations",
    title:"Refutations",
    blurb:"Islamic responses to theological and philosophical objections raised by other traditions and worldviews.",
    icon:"shield",
    numbered:false,
    subs:[
      ["Heretics","Responses to historical sects and beliefs considered outside mainstream orthodoxy."],
      ["Christians","Common objections raised in Christian apologetics, and Islamic responses."],
      ["Jews","Common objections raised in Jewish apologetics, and Islamic responses."],
      ["Philosophers","Responses to philosophical objections to religious belief."],
      ["Westerners","Responses to common secular and Western critiques of Islam."]
    ]
  },
  {
    id:"fiqh",
    title:"Fiqh",
    blurb:"Islamic jurisprudence — its early authorities, its scope of worship and ethics, and its living tradition of rulings.",
    icon:"scales",
    numbered:false,
    subs:[
      ["Importance of Ahlul Medina","The scholarly weight given to the practice of Medina's early community."],
      ["Value of the salaf including Imam Malik","The legal methodology and legacy of early jurists like Imam Malik."],
      ["Different acts of worship","The core acts of worship and their rulings.",[
        ["Salah",""],
        ["Purification",""],
        ["Dua",""],
        ["Fasting",""],
        ["Pilgrimage",""],
        ["Dhikr",""],
        ["Habits",""]
      ]],
      ["Fatawa","Contemporary religious rulings on modern questions.",[
        ["Tasweer",""],
        ["Awrah",""],
        ["Mahrams",""],
        ["Combining salah",""]
      ]]
    ]
  }
];

/* ============ ICONS (geometric / object line-art only — no living beings) ============ */
const STAR_PATH = "M150,20 L170.67,100.11 L241.92,58.08 L199.89,129.33 L280,150 L199.89,170.67 L241.92,241.92 L170.67,199.89 L150,280 L129.33,199.89 L58.08,241.92 L100.11,170.67 L20,150 L100.11,129.33 L58.08,58.08 L129.33,100.11 Z";

const ICONS = {
  book:`<svg class="ic" viewBox="0 0 48 48"><path d="M24 10c-4-3-10-4-16-3v27c6-1 12 0 16 3 4-3 10-4 16-3V7c-6-1-12 0-16 3Z"/><path d="M24 10v27"/></svg>`,
  compass:`<svg class="ic" viewBox="0 0 48 48"><circle cx="24" cy="24" r="16"/><path d="M30 18l-9 6-3 9 9-6 3-9Z"/></svg>`,
  lantern:`<svg class="ic" viewBox="0 0 48 48"><path d="M18 10h12M24 4v6M16 16h16l-2 20a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2L16 16Z"/><path d="M20 22v10M28 22v10M24 40v4"/></svg>`,
  shield:`<svg class="ic" viewBox="0 0 48 48"><path d="M24 5 10 10v12c0 10 6 17 14 21 8-4 14-11 14-21V10L24 5Z"/><path d="M18 23l4 4 8-9"/></svg>`,
  scales:`<svg class="ic" viewBox="0 0 48 48"><path d="M24 6v34M10 14h28M10 14l-5 11a5 5 0 0 0 10 0Zm28 0l-5 11a5 5 0 0 0 10 0Z"/><path d="M16 40h16"/></svg>`
};

/* ============ HELPERS ============ */
const slugify = s => s.toLowerCase().replace(/[^\w\s-]/g,"").trim().replace(/\s+/g,"-");
const forumById = id => FORUMS.find(f => f.id === id);
const app = document.getElementById("app");

function starSVG(size, withMark){
  return `<svg class="intro-star" viewBox="0 0 300 300" width="${size}" height="${size}">
    <path d="${STAR_PATH}"/>
    ${withMark ? '<circle class="inner-mark" cx="150" cy="150" r="7"/>' : ''}
  </svg>`;
}
function wordmarkSVG(){
  return `<svg viewBox="0 0 300 300"><path d="${STAR_PATH}"/></svg>`;
}

/* ============ VIEWS ============ */
function renderIntro(){
  app.innerHTML = `
  <div class="view intro" id="introTap">
    ${starSVG(180, true)}
    <h1>Ilm</h1>
    <p class="kicker">A quiet path through the history, evidence, and practice of Islam.</p>
    <div class="enter-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h14M13 6l6 6-6 6"/></svg>
      Tap anywhere to enter
    </div>
  </div>`;
  document.getElementById("introTap").addEventListener("click", () => { location.hash = "#/index"; });
}

function topbar(crumbs){
  const crumbHTML = crumbs.map((c,i) => {
    const isLast = i === crumbs.length-1;
    return (isLast
      ? `<span>${c.label}</span>`
      : `<a href="${c.href}">${c.label}</a><span class="sep">/</span>`);
  }).join("");
  return `
  <div class="topbar">
    <a class="wordmark" href="#/index">${wordmarkSVGSmall()} Ilm</a>
    <nav class="crumbs">${crumbHTML}</nav>
  </div>`;
}
function wordmarkSVGSmall(){
  return `<svg viewBox="0 0 300 300"><path d="${STAR_PATH}"/></svg>`;
}

function renderIndex(){
  const cards = FORUMS.map(f => `
    <a class="forum-card" href="#/forum/${f.id}">
      ${ICONS[f.icon]}
      <h2>${f.title}</h2>
      <p>${f.blurb}</p>
      <span class="count">${f.subs.length} sections</span>
    </a>`).join("");

  app.innerHTML = `
  <div class="view">
    ${topbar([{label:"Index"}])}
    <main>
      <div class="index-head">
        <h1>Index</h1>
        <p>Five sections, arranged as a path from history to belief to practice.</p>
      </div>
      <div class="forum-grid">${cards}</div>
    </main>
    <footer>Ilm — for study and reflection.</footer>
  </div>`;
}

function tocList(items, hrefFor, numbered){
  return items.map(([title,desc], i) => `
    <a class="toc-item" href="${hrefFor(title)}">
      ${numbered ? `<span class="num">${String(i+1).padStart(2,"0")}</span>` : ""}
      <span class="body">
        <span class="ttl">${title}</span>
        ${desc ? `<span class="desc">${desc}</span>` : ""}
      </span>
      <span class="arrow">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h14M13 6l6 6-6 6"/></svg>
      </span>
    </a>`).join("");
}

function placeholderPage(crumbs, eyebrow, title, desc, backHref, backLabel){
  return `
  <div class="view">
    ${topbar(crumbs)}
    <main>
      <p class="sf-eyebrow">${eyebrow}</p>
      <h1 class="sf-title">${title}</h1>
      ${desc ? `<p class="sf-desc">${desc}</p>` : `<p class="sf-desc">&nbsp;</p>`}
      <div class="sf-panel">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M12 8v5M12 16h.01M12 3l9 16H3L12 3Z"/></svg>
        <p><strong>This section is still being written.</strong> Come back soon, or ask Dai what you'd like to know about this page, @dnx4 on discord.</p>
      </div>
      <a class="back-link" href="${backHref}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12H6M11 6l-6 6 6 6"/></svg>
        Back to ${backLabel}
      </a>
    </main>
    <footer>Ilm — for study and reflection.</footer>
  </div>`;
}

function renderForum(id){
  const f = forumById(id);
  if(!f){ location.hash = "#/index"; return; }
  const items = tocList(f.subs, title => `#/forum/${f.id}/${slugify(title)}`, f.numbered);

  app.innerHTML = `
  <div class="view">
    ${topbar([{label:"Index",href:"#/index"},{label:f.title}])}
    <main>
      <div class="forum-head">${ICONS[f.icon]}<h1>${f.title}</h1></div>
      <p class="forum-sub">${f.blurb}</p>
      <div class="toc">${items}</div>
    </main>
    <footer>Ilm — for study and reflection.</footer>
  </div>`;
}

function renderSub(fid, slug){
  const f = forumById(fid);
  if(!f){ location.hash = "#/index"; return; }
  const idx = f.subs.findIndex(([title]) => slugify(title) === slug);
  if(idx === -1){ location.hash = `#/forum/${fid}`; return; }
  const [title, desc, children] = f.subs[idx];

  if(children && children.length){
    const items = tocList(children, ct => `#/forum/${f.id}/${slug}/${slugify(ct)}`, false);
    app.innerHTML = `
    <div class="view">
      ${topbar([{label:"Index",href:"#/index"},{label:f.title,href:`#/forum/${f.id}`},{label:title}])}
      <main>
        <div class="forum-head"><h1>${title}</h1></div>
        <p class="forum-sub">${desc || ""}</p>
        <div class="toc">${items}</div>
      </main>
      <footer>Ilm — for study and reflection.</footer>
    </div>`;
    return;
  }

  app.innerHTML = placeholderPage(
    [{label:"Index",href:"#/index"},{label:f.title,href:`#/forum/${f.id}`},{label:title}],
    f.title + (f.numbered ? " · " + String(idx+1).padStart(2,"0") : ""),
    title, desc,
    `#/forum/${f.id}`, f.title
  );
}

function renderLeaf(fid, slug, childSlug){
  const f = forumById(fid);
  if(!f){ location.hash = "#/index"; return; }
  const idx = f.subs.findIndex(([title]) => slugify(title) === slug);
  if(idx === -1){ location.hash = `#/forum/${fid}`; return; }
  const [title,, children] = f.subs[idx];
  if(!children){ location.hash = `#/forum/${fid}/${slug}`; return; }
  const cidx = children.findIndex(([ct]) => slugify(ct) === childSlug);
  if(cidx === -1){ location.hash = `#/forum/${fid}/${slug}`; return; }
  const [ctitle, cdesc] = children[cidx];

  app.innerHTML = placeholderPage(
    [{label:"Index",href:"#/index"},{label:f.title,href:`#/forum/${f.id}`},{label:title,href:`#/forum/${f.id}/${slug}`},{label:ctitle}],
    f.title + " · " + title,
    ctitle, cdesc,
    `#/forum/${f.id}/${slug}`, title
  );
}

/* ============ ROUTER ============ */
function route(){
  const hash = location.hash.replace(/^#\/?/,"");
  const parts = hash.split("/").filter(Boolean);
  window.scrollTo(0,0);

  if(parts.length === 0){ renderIntro(); return; }
  if(parts[0] === "index"){ renderIndex(); return; }
  if(parts[0] === "forum" && parts[1] && !parts[2]){ renderForum(parts[1]); return; }
  if(parts[0] === "forum" && parts[1] && parts[2] && !parts[3]){ renderSub(parts[1], parts[2]); return; }
  if(parts[0] === "forum" && parts[1] && parts[2] && parts[3]){ renderLeaf(parts[1], parts[2], parts[3]); return; }
  renderIntro();
}
window.addEventListener("hashchange", route);
route();
</script>
